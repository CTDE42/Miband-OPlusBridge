name: Debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      TZ: Asia/Shanghai
      KEYSTORE_BASE64: ${{ secrets.OPLUSBAND_KEYSTORE_BASE64 }}
      OPLUSBAND_STORE_PASSWORD: ${{ secrets.OPLUSBAND_STORE_PASSWORD }}
      OPLUSBAND_KEY_ALIAS: ${{ secrets.OPLUSBAND_KEY_ALIAS }}
      OPLUSBAND_KEY_PASSWORD: ${{ secrets.OPLUSBAND_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;35.0.0"
      - name: Decode keystore
        run: |
          python3 - <<'PY'
          import base64, os, pathlib
          raw = os.environ.get("KEYSTORE_BASE64", "")
          if not raw.strip():
              raise SystemExit("OPLUSBAND_KEYSTORE_BASE64 is empty")
          pathlib.Path(os.environ["RUNNER_TEMP"], "project.jks").write_bytes(base64.b64decode(raw))
          PY
      - name: Assemble debug APK
        env:
          OPLUSBAND_KEYSTORE: ${{ runner.temp }}/project.jks
        run: chmod +x ./gradlew && ./gradlew --no-daemon :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
